services:
  db:
    ports:
      - "54322:5432"
    volumes:
      - supabase-db-ci:/var/lib/postgresql/data

  auth:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    expose:
      - "1025"
      - "8025"

volumes:
  supabase-db-ci:
