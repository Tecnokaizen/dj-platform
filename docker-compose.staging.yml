services:
  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?required}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?required}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?required}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?required}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?required}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?required}
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true

  migrator:
    profiles: ["release"]
    build:
      context: .
      target: migrator
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?required}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?required}
      SUPABASE_CLI_VERSION: "2.109.1"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    expose:
      - "1025"
      - "8025"
    networks:
      - default

