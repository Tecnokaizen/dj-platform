services:
  postgres-test:
    image: postgres:18-alpine
    container_name: dj-platform-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: dj_platform_test
      POSTGRES_PASSWORD: dj_platform_test
      POSTGRES_DB: dj_platform_test
    ports:
      - "5433:5432"
    volumes:
      - dj_platform_postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dj_platform_test -d dj_platform_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  dj_platform_postgres_test_data:
